# Development only. Never point this at production.
# Per-worktree settings live in .env (not committed):
#   COMPOSE_PROJECT_NAME, APP_PORT, DB_PORT, DB_PASSWORD

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pickems
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: pickems_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickems -d pickems_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    command: ["gunicorn", "-w", "1", "--reload", "-b", "0.0.0.0:8000", "wsgi:app"]
    volumes:
      - .:/app
    ports:
      - "${APP_PORT:-5001}:8000"
    environment:
      DATABASE_URL: postgresql://pickems:${DB_PASSWORD}@db:5432/pickems_dev
      SECRET_KEY: dev-only-not-a-secret
      DISABLE_APSCHEDULER: "1"
      # Intentionally unset: Brevo API key, VAPID keys -> no email or push in dev
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
